{% extends "base.html" %}
{% block title %}Organiser login{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>Organiser login</h1>
  <p class="muted">This one-time link logs you in once. Continue to use it up.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}

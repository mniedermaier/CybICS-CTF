{% extends "base.html" %}
{% block title %}Organiser login{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>Organiser login</h1>
  <form method="post" class="row">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="sr-only" for="password">Admin password</label>
    <input type="password" id="password" name="password" placeholder="Admin password" autocomplete="current-password" autofocus required>
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}

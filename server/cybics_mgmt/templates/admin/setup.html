{% extends "base.html" %}
{% block title %}Set the admin password{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>Set the admin password</h1>
  <p class="muted">This server has no admin password yet. The one you set now protects the organiser pages.
    At least {{ minimum }} characters.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <p><label class="sr-only" for="password">New admin password</label>
       <input type="password" id="password" name="password" placeholder="New admin password" minlength="{{ minimum }}"
              autocomplete="new-password" autofocus required></p>
    <p><label class="sr-only" for="confirm">Repeat it</label>
       <input type="password" id="confirm" name="confirm" placeholder="Repeat it" minlength="{{ minimum }}"
              autocomplete="new-password" required></p>
    <button type="submit">Set and log in</button>
  </form>
</div>
{% endblock %}

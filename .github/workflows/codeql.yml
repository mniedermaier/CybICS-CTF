name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  # One run per workflow per ref; pull request runs are cancelled by a newer
  # push, runs on main are not.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # A job-level permissions block replaces the defaults: without
      # contents: read, checkout of a private repository fails.
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ python, javascript-typescript ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          # Code scanning uploads need GitHub Advanced Security on private
          # repositories; there, keep the results as an artifact instead.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
      - name: Keep the results (private repository)
        if: github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results

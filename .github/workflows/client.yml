name: client

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  # One run per workflow per ref; pull request runs are cancelled by a newer
  # push, runs on main are not.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client-py39:
    # The client is vendored into CybICS and promises Python 3.9+.
    name: Reference client on Python 3.9
    runs-on: ubuntu-latest
    container: python:3.9-alpine
    steps:
      - uses: actions/checkout@v7
      - run: pip install flask==3.1.3 werkzeug==3.1.9 cryptography==50.0.2 pytest==8.4.2
      - run: python -m pytest -p no:cacheprovider tests/test_client.py tests/test_fleet_client.py
        working-directory: server

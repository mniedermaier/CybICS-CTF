# Front proxy for the CybICS CTF server.
#
# gunicorn runs a fixed pool of threads; a participant who opens a few dozen
# connections and trickles bytes into them would tie up every thread and
# freeze the event. nginx reads each request completely, with short timeouts,
# before handing it to gunicorn. Slow or idle connections then cost only
# nginx, which holds tens of thousands of them cheaply.
#
# There is deliberately no per-address connection cap here: a classroom, the
# projector and the organiser often share one NAT address, so such a cap is a
# switch any one participant can flip for everybody behind it. Raw connection
# floods from the internet are the host firewall's job (README, "Connection
# floods").

# Fixed, not "auto": memory must fit the container limit whatever the host's
# core count.
worker_processes 2;
worker_rlimit_nofile 40000;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 16384;
}

http {
    access_log off;            # gunicorn logs every request already
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Slow clients get dropped instead of holding anything for long.
    client_header_timeout 5s;
    client_body_timeout   5s;
    send_timeout          15s;
    keepalive_timeout     30s;
    reset_timedout_connection on;
    client_header_buffer_size 1k;
    client_body_buffer_size   8k;
    client_max_body_size      1m;   # admin catalog upload; the API gets far less below

    # Real client address. Behind an outer TLS proxy (Caddy, Traefik), trust
    # its X-Forwarded-For, and only its: MGMT_OUTER_PROXY in docker-compose.yml.
    # Without one, the sentinel below matches nothing.
    include /tmp/outer-proxy.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Keep "https" only from that outer proxy; a client cannot claim it.
    map "$from_outer_proxy:$http_x_forwarded_proto" $forwarded_proto {
        default  $scheme;
        "1:https" https;
    }

    # Enrolment is the one request that costs real CPU (password hashing).
    # Bursts are queued briefly, not refused, so a class enrolling together
    # gets through within the client's timeout; a flood from one address is
    # held to this rate. The only per-address limit here: it slows, it never
    # blocks anybody's heartbeats or solves.
    limit_req_zone $binary_remote_addr zone=enroll:10m rate=8r/s;
    limit_req_status 429;

    upstream app {
        server server:8000;
        keepalive 16;
    }

    server {
        listen 8080;

        # Everything the app needs to know about the client, set here and
        # nowhere else: anything a client sends in these headers is replaced.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host "";
        proxy_request_buffering on;   # the whole body before gunicorn sees it
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        location = /api/v1/enroll {
            limit_req zone=enroll burst=48;
            client_max_body_size 16k;
            proxy_pass http://app;
        }

        # Fleet enrolment shares the queue: same address, same rate.
        location = /api/v1/fleet/enroll {
            limit_req zone=enroll burst=48;
            client_max_body_size 16k;
            proxy_pass http://app;
        }

        # Instance API: a heartbeat status is at most 16 KB.
        location /api/ {
            client_max_body_size 64k;
            proxy_pass http://app;
        }

        location / {
            proxy_pass http://app;
        }
    }
}

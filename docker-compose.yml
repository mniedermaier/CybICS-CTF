# Central CTF server for CybICS. Optional: CybICS instances work without it.
#
#   CTF_ADMIN_PASSWORD=... docker compose up -d
#
# Every CTF_* setting from the README can be set in the shell or in a .env
# file next to this file.
#
# Two containers: "proxy" (nginx) is the only one reachable from outside. It
# buffers requests and drops slow clients, so a participant cannot tie up the
# app's threads. "ctf-server" (gunicorn + Flask) only talks to the proxy.
services:
  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    depends_on:
      ctf-server:
        condition: service_healthy
    ports:
      - "${CTF_BIND:-0.0.0.0}:${CTF_PORT:-8000}:8080"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/templates:/etc/nginx/templates:ro
    environment:
      # Address or CIDR of an outer TLS proxy in front of this one, as nginx
      # sees it (for Caddy on the host: the network gateway, 172.29.84.1).
      # The default (TEST-NET-1, never routed) matches nothing: clients
      # connect to nginx directly.
      CTF_OUTER_PROXY: ${CTF_OUTER_PROXY:-192.0.2.255/32}
      # The image renders templates into this directory at start; the root
      # filesystem is read-only.
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    networks:
      ctf:
        ipv4_address: ${CTF_PROXY_IP:-172.29.84.2}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    ulimits:
      nofile: 40000
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s

  ctf-server:
    build: ./server
    image: cybics-ctf-server:latest
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      ctf:
        ipv4_address: ${CTF_APP_IP:-172.29.84.3}
    environment:
      CTF_ADMIN_PASSWORD: ${CTF_ADMIN_PASSWORD:-}
      CTF_ALLOW_WEAK_ADMIN_PASSWORD: ${CTF_ALLOW_WEAK_ADMIN_PASSWORD:-0}
      CTF_SECRET_KEY: ${CTF_SECRET_KEY:-}
      CTF_SERVER_NAME: ${CTF_SERVER_NAME:-CybICS CTF}
      CTF_PUBLIC_URL: ${CTF_PUBLIC_URL:-}
      CTF_HEARTBEAT_INTERVAL: ${CTF_HEARTBEAT_INTERVAL:-30}
      CTF_ONLINE_WINDOW: ${CTF_ONLINE_WINDOW:-90}
      CTF_RATE_ENROLL: ${CTF_RATE_ENROLL:-60}
      CTF_RATE_HEARTBEAT: ${CTF_RATE_HEARTBEAT:-30}
      CTF_RATE_SOLVE: ${CTF_RATE_SOLVE:-30}
      CTF_RATE_LOGIN: ${CTF_RATE_LOGIN:-10}
      CTF_RATE_NEW_TEAMS: ${CTF_RATE_NEW_TEAMS:-100}
      CTF_ADMIN_SESSION_HOURS: ${CTF_ADMIN_SESSION_HOURS:-12}
      # The proxy above is the only peer allowed to set X-Forwarded-*.
      CTF_TRUST_PROXY: "1"
      CTF_FORWARDED_ALLOW_IPS: ${CTF_PROXY_IP:-172.29.84.2}
      CTF_SECURE_COOKIES: ${CTF_SECURE_COOKIES:-0}
      CTF_LOG_LEVEL: ${CTF_LOG_LEVEL:-INFO}
    volumes:
      - ctf-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging: *logging

networks:
  ctf:
    ipam:
      config:
        # Change if it collides with a local network (and the two IPs above).
        - subnet: ${CTF_SUBNET:-172.29.84.0/24}

volumes:
  ctf-data:
